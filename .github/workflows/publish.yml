name: publish

# The publish job is spelled out here rather than calling a reusable workflow,
# and that is not a style choice. PyPI's trusted publishing matches on the
# workflow that performs the upload, and a reusable workflow cannot be named
# as the publisher at all:
#
#   https://docs.pypi.org/trusted-publishers/troubleshooting/
#   https://github.com/pypi/warehouse/issues/11096
#
# Calling one makes PyPI see `job_workflow_ref` pointing at the template
# repository, which no publisher configuration can match, and the upload is
# refused with `invalid-publisher`.
#
# The composite actions below are still shared from pipeline-templates. Those
# run inside this workflow rather than replacing it, so the OIDC claim stays
# `janbalitaan/lexmatch/.github/workflows/publish.yml` — which is what the
# trusted publisher is configured with.
#
# A published release, not a tag: a tag pushed by mistake can be deleted, a
# release is a deliberate act. `workflow_dispatch` exists so the path can be
# rehearsed against TestPyPI before a real release depends on it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish. Use testpypi to rehearse.'
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  publish:
    # One job on purpose. Splitting build and publish would mean passing the
    # distributions between them as an artifact, which costs storage on every
    # release and buys nothing when the two steps are seconds apart.
    runs-on: ubuntu-latest
    # No `environment:`. A GitHub environment adds an `environment` claim to
    # the OIDC token, and a PyPI trusted publisher only matches a token whose
    # claims it was configured for. Naming one here while the publisher leaves
    # Environment blank is an invalid-publisher error at upload time, which is
    # how three releases were lost before the cause was found.
    permissions:
      contents: read
      # Trusted publishing exchanges this short-lived OIDC token for an upload
      # token. Nothing long-lived is stored, so there is nothing to rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: janbalitaan/pipeline-templates/python/setup@main
        with:
          python-version: '3.12'
          sync-args: --all-extras

      # Re-run the checks before publishing. Shipping a version that fails its
      # own tests is worse than shipping late.
      - uses: janbalitaan/pipeline-templates/python/gate@main
        with:
          source-dir: src
          test-dir: tests
          max-complexity: '15'

      - uses: janbalitaan/pipeline-templates/python/build@main
        with:
          verify-tag: 'true'

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Empty means PyPI. A manual run defaults to TestPyPI so a mis-click
          # rehearses rather than publishes.
          # Inverted deliberately, so the non-empty value is the true branch.
          # `A && B || C` is not a ternary: it yields B when both A and B are
          # truthy, else C. With `&& '' ||` the empty string is falsy, so every
          # release took the false branch and went to TestPyPI. Asking "is this
          # a TestPyPI dispatch?" keeps the empty default where it cannot lose.
          repository-url: >-
            ${{ (github.event_name == 'workflow_dispatch'
                 && inputs.target == 'testpypi')
                && 'https://test.pypi.org/legacy/' || '' }}
